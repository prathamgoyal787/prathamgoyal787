<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Pratham Goyal, Software Engineer, Distributed Systems">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#151c30"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1f2842"/>
    </pattern>
    <radialGradient id="glow" cx="0.79" cy="0.5" r="0.4">
      <stop offset="0" stop-color="#3d59a1" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#3d59a1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5c98a"/>
      <stop offset="1" stop-color="#e0af68"/>
    </radialGradient>
    <path id="p-in" d="M654 140 L728 140"/>
    <path id="p-orbit" d="M790 78 A62 62 0 1 1 789.99 78"/>
    <path id="p-out" d="M852 140 L938 140"/>
  </defs>

  <rect width="1000" height="280" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="280" rx="18" fill="url(#dots)"/>
  <rect width="1000" height="280" rx="18" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="999" height="279" rx="18" fill="none" stroke="#243052"/>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="56" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#7aa2f7">~/prathamgoyal787</text>
    <text x="54" y="140" font-size="52" font-weight="700" fill="#e6e9f2" letter-spacing="-1">Pratham Goyal</text>
    <text x="56" y="180" font-size="19" fill="#a9b1d6">Software Engineer · Java · Distributed Systems</text>
    <text x="56" y="214" font-size="15" fill="#6b7394">Learning system design. Building with AI in the loop.</text>
  </g>

  <!-- edges -->
  <g stroke="#2c3858" stroke-width="1.5" fill="none">
    <line x1="654" y1="140" x2="728" y2="140"/>
    <line x1="852" y1="140" x2="938" y2="140"/>
    <circle cx="790" cy="140" r="62" stroke-dasharray="3 6">
      <animateTransform attributeName="transform" type="rotate" from="0 790 140" to="360 790 140" dur="30s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- agent core -->
  <circle cx="790" cy="140" r="14" fill="none" stroke="#e0af68" stroke-width="1.5">
    <animate attributeName="r" values="14;30" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.55;0" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="790" cy="140" r="12" fill="url(#core)">
    <animate attributeName="r" values="11;13;11" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- nodes -->
  <g fill="#0f1526" stroke-width="1.8">
    <circle cx="646" cy="140" r="7" stroke="#7aa2f7"/>
    <circle cx="790" cy="78" r="6.5" stroke="#7aa2f7"/>
    <circle cx="843.7" cy="171" r="6.5" stroke="#7aa2f7"/>
    <circle cx="736.3" cy="171" r="6.5" stroke="#7aa2f7"/>
    <circle cx="946" cy="140" r="7" stroke="#9ece6a"/>
  </g>

  <!-- labels -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#565f89" text-anchor="middle">
    <text x="646" y="166">task</text>
    <text x="790" y="60">plan</text>
    <text x="858" y="196">act</text>
    <text x="720" y="196">observe</text>
    <text x="946" y="166" fill="#6f8f4e">ship</text>
    <text x="790" y="222" fill="#8a7550">agent</text>
  </g>

  <!-- motion -->
  <circle r="3.5" fill="#7aa2f7">
    <animateMotion dur="2s" repeatCount="indefinite"><mpath href="#p-in"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#e0af68">
    <animateMotion dur="3s" repeatCount="indefinite"><mpath href="#p-orbit"/></animateMotion>
  </circle>
  <circle r="3" fill="#e0af68" opacity="0.45">
    <animateMotion dur="3s" begin="-0.25s" repeatCount="indefinite"><mpath href="#p-orbit"/></animateMotion>
  </circle>
  <circle r="3.5" fill="#9ece6a">
    <animateMotion dur="2s" begin="1s" repeatCount="indefinite"><mpath href="#p-out"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2s" begin="1s" repeatCount="indefinite"/>
  </circle>
</svg>
